name: Build installer (Windows x64)

# Build the Windows x64 installer without compiling llama.cpp in CI.
# Each job downloads the official ggml-org/llama.cpp release binary,
# builds only our thin Python gateway, then runs electron-builder.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clawd-on-desk/**"
      - "minicpm-sidecar/**"
      - "adapters/**"
      - "NOTICE.md"
      - ".github/workflows/build-installer.yml"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    name: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Electron tests
        working-directory: clawd-on-desk
        run: |
          npm ci
          node test/run-tests.js

      - name: Sidecar tests
        run: uv run --project minicpm-sidecar pytest minicpm-sidecar/tests -q -p no:cacheprovider

  build-windows:
    needs: test
    runs-on: windows-2022
    name: windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Fetch official llama.cpp release
        working-directory: minicpm-sidecar
        run: |
          .\scripts\fetch-llama-release.ps1 -Backend cpu -Target win-x64

      - name: Build gateway
        working-directory: minicpm-sidecar
        run: |
          .\scripts\build-gateway.ps1 -Target win-x64

      - name: Verify sidecar binaries
        working-directory: minicpm-sidecar
        run: |
          Get-ChildItem -Recurse bin\win-x64 | Select-Object FullName,Length
          .\bin\win-x64\llama-server.exe --version
          .\bin\win-x64\minicpm-sidecar.exe --help | Out-Null

      # x64 only (decision D3). The arm64 redist was previously the only one
      # ever downloaded and was installed unconditionally, so x64 users never
      # got the runtime they needed and got a useless arm64 one instead.
      - name: Download x64 VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "clawd-on-desk\build\vc_redist.x64.exe"

      - name: npm install
        working-directory: clawd-on-desk
        shell: cmd
        run: npm ci

      - name: Fetch LoRA adapters
        working-directory: clawd-on-desk
        run: node scripts/fetch-adapters.js

      - name: electron-builder (nsis)
        working-directory: clawd-on-desk
        shell: cmd
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            clawd-on-desk/dist/*.exe
            clawd-on-desk/dist/*.exe.blockmap
            clawd-on-desk/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
