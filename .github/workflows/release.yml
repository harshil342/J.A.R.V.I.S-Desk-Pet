name: Release DeskPet

# Windows x64 is the only supported target (plan.md decision D3). The build job:
#   1) downloads the official ggml-org/llama.cpp llama-server release
#      into minicpm-sidecar/bin/<triple>/
#   2) builds our thin FastAPI gateway for the same target
#   3) runs electron-builder in clawd-on-desk/; extraResources picks up
#      both binaries automatically.
#
# Nothing is published unless the test job is green. An unsigned Windows build
# creates a DRAFT release, never a public one, because electron-updater rejects
# an unsigned artifact at install time.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A release is a one-shot event. Two runs of the same tag must not race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Electron tests
        working-directory: clawd-on-desk
        run: |
          npm ci
          node test/run-tests.js
      - name: Sidecar tests
        run: uv run --project minicpm-sidecar pytest minicpm-sidecar/tests -q -p no:cacheprovider
      - name: Release hook self-test
        run: node scripts/release.mjs --self-test
      - name: UI anti-pattern check
        run: |
          npx --yes impeccable@latest install --providers=opencode --scope=project --no-hooks
          node scripts/ui-detect.mjs
      - name: Tag matches the shipped version
        run: |
          app=$(node -p "require('./clawd-on-desk/package.json').version")
          side=$(grep -oP '^version\s*=\s*"\K[^"]+' minicpm-sidecar/pyproject.toml)
          tag="${GITHUB_REF_NAME#v}"
          echo "app=$app sidecar=$side tag=$tag"
          [ -n "$tag" ] || { echo "::notice::workflow_dispatch with no tag; version check skipped"; exit 0; }
          [ "$app" = "$side" ] || { echo "::error::sidecar $side does not match app $app"; exit 1; }
          [ "$app" = "$tag" ]  || { echo "::error::tag v$tag does not match package.json $app"; exit 1; }

  build-windows:
    needs: test
    runs-on: windows-2022
    name: windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Fetch official llama.cpp release
        working-directory: minicpm-sidecar
        run: |
          .\scripts\fetch-llama-release.ps1 -Backend cpu -Target win-x64

      - name: Build gateway
        working-directory: minicpm-sidecar
        run: |
          .\scripts\build-gateway.ps1 -Target win-x64

      - name: Verify sidecar binaries
        working-directory: minicpm-sidecar
        run: |
          Get-ChildItem -Recurse bin\win-x64 | Select-Object FullName,Length
          .\bin\win-x64\llama-server.exe --version
          .\bin\win-x64\minicpm-sidecar.exe --help | Out-Null
          # Read the PE header. Test-Path cannot: this file used to be copied
          # from win-x64 into a win-arm64 folder and "verified" by existing.
          .\scripts\assert-pe-arch.ps1 -Path bin\win-x64\llama-server.exe -Expect x64
          .\scripts\assert-pe-arch.ps1 -Path bin\win-x64\minicpm-sidecar.exe -Expect x64

      - name: Download x64 VC++ Redistributable
        run: |
          # D3 removed arm64; the ARM64 redist was still being downloaded here and
          # installed for x64 users. It is keyed by arch on purpose.
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "clawd-on-desk\build\vc_redist.x64.exe"

      - name: npm ci
        working-directory: clawd-on-desk
        run: npm ci

      - name: Fetch LoRA adapters
        working-directory: clawd-on-desk
        run: node scripts/fetch-adapters.js

      - name: electron-builder (nsis)
        working-directory: clawd-on-desk
        shell: cmd
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            clawd-on-desk/dist/*.exe
            clawd-on-desk/dist/*.exe.blockmap
            clawd-on-desk/dist/latest.yml


  release:
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    outputs:
      # The roll job must not point the rolling channel at a draft.
      draft: ${{ steps.gate.outputs.signed == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const esc = v.replace(/\./g, "\\.");
            const re = new RegExp("^## \\[?" + esc + "\\]?[^\\n]*\\n[\\s\\S]*?(?=\\n## |$)", "m");
            const m = fs.readFileSync("CHANGELOG.md", "utf8").match(re);
            if (!m) { console.error("no CHANGELOG.md section for " + v); process.exit(1); }
            fs.writeFileSync("RELEASE_NOTES.md", m[0].trim() + "\n");
          '

      - name: Decide public vs draft
        id: gate
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] || [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing certificate. Publishing a DRAFT. Unsigned Windows builds are rejected by electron-updater at install time, so a public one would strand every existing user."
          fi

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Deskpet ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: ${{ steps.gate.outputs.signed == 'false' }}

  # Rolling channel: windows-latest always carries the newest signed installer
  # under one stable name, so the install docs can point at a single URL that
  # never goes stale. Adopted from Coucou, which publishes its Windows
  # installer the same way.
  #
  # Two assets per release, deliberately:
  #   v0.12.0  -> Deskpet-0.12.0-x64.exe   versioned, so a user can pin one
  #   windows-latest -> Deskpet-Setup.exe  stable, so the README never breaks
  # The stable name has to be a *copy*. Renaming the artifact itself to
  # Deskpet-Setup.exe would lose version pinning, which is the only way to
  # offer "go back to the last good build" after a bad release.
  #
  # Only moves when the release is public. Pointing the channel at a draft would
  # hand every user on that URL a build that may still be unsigned.
  roll:
    needs: [test, build-windows, release]
    if: needs.release.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skipped
        if: needs.release.outputs.draft == 'true'
        run: echo "::notice::Release is a draft, so windows-latest was left where it is."

      # Step-level if, not `exit 0` in a prior step: steps are independent, so a
      # non-failing early exit would still run the ones after it.
      - uses: actions/checkout@v4
        if: needs.release.outputs.draft != 'true'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.release.outputs.draft != 'true'
        with:
          name: windows-installer
          path: rolling

      - name: Publish the stable installer name
        if: needs.release.outputs.draft != 'true'
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls rolling/Deskpet-*-x64.exe | head -n1)
          test -n "$src" || { echo "::error::no versioned installer in rolling/"; exit 1; }
          cp "$src" rolling/Deskpet-Setup.exe
          echo "windows-latest -> $src, published as Deskpet-Setup.exe"
          ls -la rolling/

      - name: Upload Deskpet-Setup.exe to windows-latest
        if: needs.release.outputs.draft != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          files: rolling/Deskpet-Setup.exe

      - name: Point windows-latest at this release
        if: needs.release.outputs.draft != 'true'
        run: |
          git tag -f windows-latest "${{ github.ref_name }}"
          git push origin --force "refs/tags/windows-latest"
          echo "windows-latest -> ${{ github.ref_name }}"
          echo "install URL: https://github.com/${{ github.repository }}/releases/download/windows-latest/Deskpet-Setup.exe"

