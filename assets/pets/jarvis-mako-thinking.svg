<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes thBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes thOrbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes thFlick{0%,100%{opacity:1}42%{opacity:1}46%{opacity:.25}50%{opacity:1}78%{opacity:1}82%{opacity:.4}86%{opacity:1}}
@keyframes thPulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes thDash{from{stroke-dashoffset:0}to{stroke-dashoffset:-60}}
.hover-g{animation:thBob 3.2s ease-in-out infinite}
.orbit{transform-origin:100px 70px;animation:thOrbit 5s linear infinite}
.eyes{animation:thFlick 3.4s linear infinite}
.core-glow{animation:thPulse 1.6s ease-in-out infinite}
.holoring{animation:thDash 2.4s linear infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs><filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<!-- arc-reactor aura -->
<circle cx="100" cy="96" r="88" fill="none" stroke="#B4F6FB" stroke-width="5" stroke-dasharray="2 2.29" opacity="0.3">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="360 100 96" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="100" cy="96" r="66" fill="none" stroke="#B4F6FB" stroke-width="1.4" stroke-dasharray="40 20" opacity="0.32">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="-360 100 96" dur="9s" repeatCount="indefinite"/>
</circle>
<g class="hover-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8" opacity="0.8"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<g class="eyes">
<circle cx="88" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle cx="112" cy="92.5" r="3.2" fill="#7FF3FF"/>
</g>
<circle class="core-glow" cx="100" cy="134" r="9" fill="#22D9EE" filter="url(#mk-blur)"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
<ellipse class="holoring" cx="100" cy="70" rx="52" ry="14" fill="none" stroke="#22D9EE" stroke-width="1.2" stroke-dasharray="6 9" opacity="0.5"/>
<g class="orbit">
<rect x="148" y="66" width="7" height="7" fill="#22D9EE" opacity="0.9"/>
<rect x="48" y="66" width="6" height="6" fill="#FF3D81" opacity="0.8"/>
<rect x="96" y="18" width="6" height="6" fill="#7FF3FF" opacity="0.8"/>
</g>
</g>
</svg>
