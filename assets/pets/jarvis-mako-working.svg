<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes wBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes wFlame{0%,100%{transform:scaleY(.7);opacity:.6}50%{transform:scaleY(1.25);opacity:1}}
@keyframes wCode1{0%,40%{opacity:.9}45%,55%{opacity:.2}60%,100%{opacity:.9}}
@keyframes wCode2{0%,60%{opacity:.8}65%,75%{opacity:.2}80%,100%{opacity:.8}}
@keyframes wSpark{0%,86%,100%{opacity:0}88%,94%{opacity:1}}
@keyframes wPulse{0%,100%{opacity:.7}50%{opacity:1}}
.hover-g{animation:wBob 2.4s ease-in-out infinite}
.flame-l{transform-origin:87px 162px;animation:wFlame .5s ease-in-out infinite}
.flame-r{transform-origin:113px 162px;animation:wFlame .5s ease-in-out infinite .25s}
.c1{animation:wCode1 1.8s linear infinite}
.c2{animation:wCode2 1.8s linear infinite}
.spark{animation:wSpark 2.6s linear infinite}
.core-glow{animation:wPulse 1.2s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs><filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<!-- arc-reactor aura (fast spin while working) -->
<circle cx="100" cy="96" r="88" fill="none" stroke="#B4F6FB" stroke-width="5" stroke-dasharray="2 2.29" opacity="0.32">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="360 100 96" dur="4s" repeatCount="indefinite"/>
</circle>
<g class="hover-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle cx="88" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle cx="112" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle class="core-glow" cx="100" cy="134" r="9" fill="#22D9EE" filter="url(#mk-blur)"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
<rect x="82" y="156" width="10" height="6" rx="2" fill="#0B1119" stroke="#1C2A3B" stroke-width="1"/>
<rect x="108" y="156" width="10" height="6" rx="2" fill="#0B1119" stroke="#1C2A3B" stroke-width="1"/>
<polygon class="flame-l" points="83,162 91,162 87,174" fill="#22D9EE" filter="url(#mk-blur)"/>
<polygon class="flame-r" points="109,162 117,162 113,174" fill="#22D9EE" filter="url(#mk-blur)"/>
<g opacity="0.85">
<rect class="c1" x="20" y="72" width="26" height="3" rx="1.5" fill="#22D9EE"/>
<rect class="c2" x="16" y="80" width="18" height="3" rx="1.5" fill="#FF3D81"/>
<rect class="c1" x="24" y="88" width="22" height="3" rx="1.5" fill="#7FF3FF"/>
<rect class="c2" x="156" y="72" width="24" height="3" rx="1.5" fill="#22D9EE"/>
<rect class="c1" x="162" y="80" width="18" height="3" rx="1.5" fill="#7FF3FF"/>
<rect class="c2" x="154" y="88" width="20" height="3" rx="1.5" fill="#FF3D81"/>
</g>
<polygon class="spark" points="146,110 152,104 150,112 156,108" fill="#FFB020"/>
</g>
</svg>
