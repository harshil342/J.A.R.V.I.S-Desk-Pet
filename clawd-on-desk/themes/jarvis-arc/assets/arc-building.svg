<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
  </style>

  <g opacity="0.55">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="24s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.9" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- quirk: nested hex frames counter-rotating = scaffolding -->
  <g opacity="0.7">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="22s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.6">
    <polygon points="158,100 129,150.2 71,150.2 42,100 71,49.8 129,49.8" fill="none" stroke="#2FE0F2" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="16s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.5">
    <polygon points="140,100 120,134.6 80,134.6 60,100 80,65.4 120,65.4" fill="none" stroke="#35E8F7" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.85" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- construction core: pulsed hammering glow -->
  <rect x="79" y="79" width="42" height="42" fill="#17C3D6" opacity="0.5" filter="url(#jvBlur)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)"/>
  <circle cx="100" cy="100" r="11.5" fill="#35E8F7" filter="url(#jvGlow)">
    <animate attributeName="r" values="11.5;12.5;11.5" dur="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- welding sparks -->
  <g>
    <line x1="132" y1="68" x2="140" y2="60" stroke="#7FF3FC" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="66" y1="132" x2="58" y2="140" stroke="#7FF3FC" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    </line>
  </g>

  <text class="txt" x="100" y="40" opacity="0.9">BUILD</text>
  <text class="txt" x="100" y="167" opacity="0.8">SESSIONS_3</text>
</svg>
