<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
  </style>

  <g opacity="0.5">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
  </g>
  <g opacity="0.75" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="14s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.45">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
  </g>
  <g opacity="0.7">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="18s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.6">
    <circle cx="100" cy="100" r="52" fill="none" stroke="#2FE0F2" stroke-width="1.4" stroke-dasharray="0.6 5.4"/>
  </g>

  <!-- quirk: radar wedge sweeping the whole dial -->
  <g opacity="0.9">
    <path d="M100,100 L100,8 A92,92 0 0,1 146,20.4 Z" fill="#2FE0F2" opacity="0.16"/>
    <line x1="100" y1="100" x2="100" y2="8" stroke="#7FF3FC" stroke-width="2" filter="url(#jvGlow)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite"/>
  </g>
  <!-- echoes left behind by the sweep -->
  <circle cx="140" cy="52" r="2" fill="#35E8F7" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="132" r="2" fill="#35E8F7" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0.4" filter="url(#jvBlur)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)"/>
  <circle cx="100" cy="100" r="27" fill="none" stroke="#0E8CA0" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="10.5" fill="#35E8F7" filter="url(#jvGlow)">
    <animate attributeName="r" values="10.5;11.5;10.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text class="txt" x="100" y="40" opacity="0.9">SCAN</text>
  <text class="txt" x="100" y="167" opacity="0.8">SWEEP_MODE</text>
</svg>
