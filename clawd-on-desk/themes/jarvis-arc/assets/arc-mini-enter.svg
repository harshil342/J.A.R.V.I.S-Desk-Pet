<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="jvClip"><circle cx="100" cy="100" r="93"/></clipPath>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
    .flick { animation: jvTxt 7s infinite; }
    @keyframes jvTxt { 0%,88%,100% {opacity:.85} 90% {opacity:.15} 92% {opacity:.7} 94% {opacity:.2} 96% {opacity:.85} }
    .blip1 { animation: jvBlip 4s infinite; }
    .blip2 { animation: jvBlip 4s 1.3s infinite; }
    .blip3 { animation: jvBlip 4s 2.6s infinite; }
    @keyframes jvBlip { 0%,72%,100% {opacity:0} 78%,88% {opacity:1} }
  </style>

  <!-- outer sparse dash ring -->
  <g opacity="0.5">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="46s" repeatCount="indefinite"/>
  </g>
  <!-- dense tick ring -->
  <g opacity="0.85" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="26s" repeatCount="indefinite"/>
  </g>
  <!-- hex frame with wobble -->
  <g opacity="0.5">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="-1.5 100 100; 1.5 100 100; -1.5 100 100" dur="7s" repeatCount="indefinite"/>
  </g>
  <!-- mid dash ring, counter-rotating -->
  <g opacity="0.8" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="34s" repeatCount="indefinite"/>
  </g>
  <!-- dotted ring -->
  <g opacity="0.7">
    <circle cx="100" cy="100" r="52" fill="none" stroke="#2FE0F2" stroke-width="1.4" stroke-dasharray="0.6 5.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="60s" repeatCount="indefinite"/>
  </g>

  <!-- core assembly -->
  <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0.4" filter="url(#jvBlur)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)"/>
  <circle cx="100" cy="100" r="27" fill="none" stroke="#0E8CA0" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="11" fill="#35E8F7" filter="url(#jvGlow)">
    <animate attributeName="r" values="11;12.5;11" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- quirk: expanding data pulse -->
  <circle cx="100" cy="100" r="14" fill="none" stroke="#2FE0F2" stroke-width="1.2" opacity="0">
    <animate attributeName="r" values="14;52" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- quirk: scanline sweep -->
  <g clip-path="url(#jvClip)" opacity="0.35">
    <line x1="8" y1="100" x2="192" y2="100" stroke="#35E8F7" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="0 -88; 0 88" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- quirk: HUD blips -->
  <circle class="blip1" cx="178" cy="72" r="1.8" fill="#35E8F7" opacity="0"/>
  <circle class="blip2" cx="30" cy="140" r="1.5" fill="#35E8F7" opacity="0"/>
  <circle class="blip3" cx="152" cy="168" r="2" fill="#35E8F7" opacity="0"/>

  <text class="txt flick" x="100" y="40">SYS_INIT</text>
  <text class="txt" x="100" y="167" opacity="0.8">CORE_V10.2</text>
</svg>
