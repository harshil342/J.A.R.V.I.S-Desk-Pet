<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes glowAmber{0%,100%{opacity:0.5}50%{opacity:0.9}}
@keyframes blinkA{0%,49%{opacity:1}50%,100%{opacity:0.12}}
@keyframes spinCW{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.glow{animation:glowAmber 1.4s ease-in-out infinite}
.ring-in{transform-origin:100px 92px;animation:spinCW 8s linear infinite}
.seg{animation:blinkA 1.2s linear infinite}
.seg2{animation-delay:0.4s}
.seg3{animation-delay:0.8s}
</style>
<ellipse cx="100" cy="178" rx="40" ry="6" fill="#020B14" opacity="0.5"/>
