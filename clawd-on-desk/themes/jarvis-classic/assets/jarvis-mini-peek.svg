<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes glowBright{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes ping{0%{transform:scale(0.3);opacity:0.9}100%{transform:scale(1.4);opacity:0}}
@keyframes spinCW{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.glow{animation:glowBright 1s ease-in-out infinite}
.ring-in{transform-origin:100px 92px;animation:spinCW 2.5s linear infinite}
.ring-out{transform-origin:100px 92px;animation:spinCW 4s linear infinite}
.ping1{transform-origin:100px 92px;animation:ping 1.8s ease-out infinite}
.ping2{transform-origin:100px 92px;animation:ping 1.8s ease-out 0.9s infinite}
</style>
<ellipse cx="100" cy="178" rx="40" ry="6" fill="#020B14" opacity="0.5"/>
<defs>
<filter id="jarvis-blur" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="7"/>
</filter>
</defs>
<circle cx="100" cy="92" r="48" fill="#081426" stroke="#0E2C4A" stroke-width="3"/>
<circle cx="100" cy="92" r="36" fill="#061020" stroke="#0A2036" stroke-width="2"/>
<g transform="rotate(0 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(36 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(72 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(108 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(144 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(180 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(216 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(252 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(288 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(324 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<circle class="glow" cx="100" cy="92" r="26" fill="#1FC8E8" filter="url(#jarvis-blur)"/>
<circle cx="100" cy="92" r="19" fill="#C9F6FF" stroke="#6FE8FF" stroke-width="2.5"/>
<polygon points="100,81 109.5,97.5 90.5,97.5" fill="#7FE9FF" opacity="0.9"/>
<circle cx="100" cy="92" r="4.5" fill="#FFFFFF"/>
<circle class="ring-in" cx="100" cy="92" r="53" fill="none" stroke="#2FB6D9" stroke-width="2" stroke-dasharray="10 7" opacity="0.75"/>
<circle class="ring-out" cx="100" cy="92" r="60" fill="none" stroke="#1E8FB3" stroke-width="1.6" stroke-dasharray="2 10" opacity="0.6"/>
<circle class="ping1" cx="100" cy="92" r="50" fill="none" stroke="#7FE9FF" stroke-width="2.5"/>
<circle class="ping2" cx="100" cy="92" r="50" fill="none" stroke="#BFF4FF" stroke-width="1.5"/>
<g class="core-g"><circle cx="100" cy="92" r="19" fill="#C9F6FF" stroke="#6FE8FF" stroke-width="2.5"/>
<polygon points="100,81 109.5,97.5 90.5,97.5" fill="#7FE9FF" opacity="0.9"/>
<circle cx="100" cy="92" r="4.5" fill="#FFFFFF"/></g>
</svg>
