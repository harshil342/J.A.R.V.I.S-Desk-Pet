<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes burstA{0%{transform:scale(0.25);opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes burstB{0%,15%{transform:scale(0.25);opacity:0}30%{opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes glowPulse{0%,100%{opacity:0.6}50%{opacity:1}}
.glow{animation:glowPulse 0.5s ease-in-out infinite}
.burstA{transform-origin:100px 92px;animation:burstA 1.4s ease-out infinite}
.burstB{transform-origin:100px 92px;animation:burstB 1.4s ease-out infinite}
</style>
<ellipse cx="100" cy="178" rx="40" ry="6" fill="#020B14" opacity="0.5"/>
