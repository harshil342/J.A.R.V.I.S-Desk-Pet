<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes bBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes bCube1{0%,10%{opacity:0;transform:translateY(6px) scale(.6)}25%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bCube2{0%,35%{opacity:0;transform:translateY(6px) scale(.6)}50%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bCube3{0%,60%{opacity:0;transform:translateY(6px) scale(.6)}75%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bRing{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes bWeld{0%,80%,100%{opacity:0}84%,92%{opacity:1}}
.hover-g{animation:bBob 2.6s ease-in-out infinite}
.cube1{animation:bCube1 6s ease-out infinite}
.cube2{animation:bCube2 6s ease-out infinite}
.cube3{animation:bCube3 6s ease-out infinite}
.iring{transform-origin:150px 158px;animation:bRing 4s linear infinite}
.weld{animation:bWeld 1.9s linear infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<g class="hover-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle cx="88" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle cx="112" cy="92.5" r="3.2" fill="#7FF3FF"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
</g>
<g transform="translate(150,120)" stroke="#22D9EE" stroke-width="1.4" fill="none" opacity="0.9">
<g class="cube1"><path d="M-10,26 L0,21 L10,26 L0,31 Z M-10,26 L-10,36 L0,41 L0,31 M10,26 L10,36 L0,41"/></g>
<g class="cube2"><path d="M-10,12 L0,7 L10,12 L0,17 Z M-10,12 L-10,22 L0,27 L0,17 M10,12 L10,22 L0,27"/></g>
<g class="cube3"><path d="M-10,-2 L0,-7 L10,-2 L0,3 Z M-10,-2 L-10,8 L0,13 L0,3 M10,-2 L10,8 L0,13"/></g>
</g>
<ellipse class="iring" cx="150" cy="158" rx="22" ry="6" fill="none" stroke="#FF3D81" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.7"/>
<polygon class="weld" points="138,138 144,132 142,140 148,136" fill="#FFB020"/>
</svg>
