<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes cpDrop{0%{transform:translateY(0) rotate(0deg)}60%{transform:translateY(16px) rotate(-3deg)}100%{transform:translateY(18px) rotate(-4deg)}}
@keyframes cpFlicker{0%{opacity:.9}20%{opacity:.3}35%{opacity:.7}55%{opacity:.15}75%{opacity:.4}100%{opacity:.08}}
@keyframes cpTailDroop{0%{transform:rotate(0)}100%{transform:rotate(14deg)}}
.drop-g{transform-origin:100px 120px;animation:cpDrop 1.6s ease-in forwards}
.lights{animation:cpFlicker 1.6s linear forwards}
.tail{transform-origin:100px 152px;animation:cpTailDroop 1.6s ease-in forwards}
</style>
