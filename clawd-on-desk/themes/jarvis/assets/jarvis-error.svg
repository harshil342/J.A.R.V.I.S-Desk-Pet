<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes eGlitch{0%,100%{transform:translate(0,0)}8%{transform:translate(-2px,1px)}16%{transform:translate(2px,-1px)}24%{transform:translate(0,0)}62%{transform:translate(0,0)}68%{transform:translate(2px,1px)}74%{transform:translate(-2px,0)}80%{transform:translate(0,0)}}
@keyframes eAlert{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes eStatic{0%,100%{opacity:0}12%,18%{opacity:.7}40%,46%{opacity:.5}70%,76%{opacity:.8}}
@keyframes ePulse{0%,100%{opacity:.5}50%{opacity:1}}
.glitch-g{animation:eGlitch 1.4s steps(1) infinite}
.alert{animation:eAlert .9s ease-in-out infinite}
.static1{animation:eStatic 1.4s linear infinite}
.core-red{animation:ePulse .8s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs><filter id="mk-rblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<g class="glitch-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#3A1520" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#120E14" stroke="#5A1626" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#160F16" stroke="#5A1626" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#FF3B50" stroke-width="1.8" opacity="0.8"/>
<polygon points="56,104 30,124 58,128" fill="#110D13" stroke="#5A1626" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#110D13" stroke="#5A1626" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#0A0608" stroke="#5A1626" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#5C1220"/>
<circle cx="88" cy="92.5" r="3.2" fill="#FF6E7E"/>
<circle cx="112" cy="92.5" r="3.2" fill="#FF6E7E"/>
<rect class="static1" x="72" y="86" width="56" height="2" fill="#FF3B50" opacity="0.6"/>
<rect class="static1" x="72" y="98" width="40" height="2" fill="#FF3B50" opacity="0.5"/>
<circle class="core-red" cx="100" cy="134" r="9" fill="#FF3B50" filter="url(#mk-rblur)"/>
<path d="M100,138.5 L106.5,130.5 L93.5,130.5 Z" fill="#FF6E7E" stroke="#FF3B50" stroke-width="1.4"/>
</g>
<g class="alert">
<path d="M100,4 L112,24 L88,24 Z" fill="#2A0A10" stroke="#FF3B50" stroke-width="1.8"/>
<line x1="100" y1="11" x2="100" y2="17.5" stroke="#FF6E7E" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="100" cy="21" r="1.4" fill="#FF6E7E"/>
</g>
</svg>
