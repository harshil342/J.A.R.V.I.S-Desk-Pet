<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes swBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes swSweep{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes swBar{0%,100%{transform:translateX(-34px);opacity:.4}50%{transform:translateX(34px);opacity:.9}}
@keyframes swEye{0%,100%{opacity:.8}50%{opacity:1}}
.hover-g{animation:swBob 3s ease-in-out infinite}
.beam{transform-origin:100px 92px;animation:swSweep 3.4s ease-in-out infinite}
.scanbar{animation:swBar 3.4s ease-in-out infinite}
.eyes{animation:swEye 1.4s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<g class="hover-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<g class="eyes">
<circle cx="88" cy="92.5" r="3.4" fill="#7FF3FF"/>
<circle cx="112" cy="92.5" r="3.4" fill="#7FF3FF"/>
</g>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
</g>
<path class="beam" d="M100,92 L74,172 A 56 56 0 0 0 126,172 Z" fill="#22D9EE" opacity="0.12"/>
<rect class="scanbar" x="90" y="170" width="20" height="3" rx="1.5" fill="#22D9EE"/>
</svg>
