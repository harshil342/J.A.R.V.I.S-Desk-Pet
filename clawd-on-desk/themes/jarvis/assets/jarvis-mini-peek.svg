<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes aPerk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes aPing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes aFinUp{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-14deg)}}
@keyframes aFinUpR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(14deg)}}
@keyframes aBright{0%,100%{opacity:.85}50%{opacity:1}}
.hover-g{animation:aPerk 1.6s ease-in-out infinite}
.ping{transform-origin:100px 92px;animation:aPing 2.1s ease-out infinite}
.ping2{transform-origin:100px 92px;animation:aPing 2.1s ease-out infinite .7s}
.ping3{transform-origin:100px 92px;animation:aPing 2.1s ease-out infinite 1.4s}
.fin-l{transform-origin:58px 106px;animation:aFinUp 1.6s ease-in-out infinite}
.fin-r{transform-origin:142px 106px;animation:aFinUpR 1.6s ease-in-out infinite}
.eyes{animation:aBright 1s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<!-- arc-reactor aura -->
<circle cx="100" cy="96" r="92" fill="none" stroke="#B4F6FB" stroke-width="1.4" stroke-dasharray="50 5" opacity="0.4"/>
<circle cx="100" cy="96" r="84" fill="none" stroke="#B4F6FB" stroke-width="5" stroke-dasharray="2 2.29" opacity="0.3">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="360 100 96" dur="6s" repeatCount="indefinite"/>
</circle>
<circle class="ping" cx="100" cy="92" r="44" fill="none" stroke="#64E6EF" stroke-width="2"/>
<circle class="ping2" cx="100" cy="92" r="44" fill="none" stroke="#64E6EF" stroke-width="1.6"/>
<circle class="ping3" cx="100" cy="92" r="44" fill="none" stroke="#B4F6FB" stroke-width="1.2"/>
<g class="hover-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#64E6EF" stroke-width="2"/>
<polygon class="fin-l" points="56,104 30,118 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon class="fin-r" points="144,104 170,118 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<g class="eyes">
<circle cx="88" cy="92.5" r="3.8" fill="#D1FBFC"/>
<circle cx="112" cy="92.5" r="3.8" fill="#D1FBFC"/>
</g>
<circle cx="100" cy="134" r="8" fill="#64E6EF" opacity="0.6" filter="url(#a-blur)"/>
<path d="M100,138 L105.5,131 L94.5,131 Z" fill="#D1FBFC" stroke="#B4F6FB" stroke-width="1.4"/>
</g>
<defs><filter id="a-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>
</svg>
