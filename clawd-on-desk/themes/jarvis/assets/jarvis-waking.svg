<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes wkRise{0%{transform:translateY(18px) rotate(-3deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes wkOn1{0%,30%{opacity:.1}55%,100%{opacity:1}}
@keyframes wkOn2{0%,50%{opacity:.1}75%,100%{opacity:1}}
@keyframes wkOn3{0%,70%{opacity:.1}95%,100%{opacity:1}}
@keyframes wkFin{0%{transform:rotate(16deg)}100%{transform:rotate(0deg)}}
.rise-g{transform-origin:100px 120px;animation:wkRise 2.2s ease-out forwards}
.pw1{animation:wkOn1 2.2s linear forwards}
.pw2{animation:wkOn2 2.2s linear forwards}
.pw3{animation:wkOn3 2.2s linear forwards}
.fin-l{transform-origin:58px 106px;animation:wkFin 2.2s ease-out forwards}
.fin-r{transform-origin:142px 106px;animation:wkFin 2.2s ease-out forwards reverse}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<g class="rise-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline class="pw1" points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8"/>
<polygon class="fin-l" points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon class="fin-r" points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect class="pw2" x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle class="pw2" cx="88" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle class="pw2" cx="112" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle class="pw3" cx="100" cy="134" r="8" fill="#22D9EE" opacity="0.8" style="filter:blur(4px)"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
<rect x="82" y="156" width="10" height="6" rx="2" fill="#0B1119" stroke="#1C2A3B" stroke-width="1"/>
<rect x="108" y="156" width="10" height="6" rx="2" fill="#0B1119" stroke="#1C2A3B" stroke-width="1"/>
</g>
</svg>
