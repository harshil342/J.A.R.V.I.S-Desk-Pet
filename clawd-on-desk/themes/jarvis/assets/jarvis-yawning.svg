<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes ywTilt{0%,100%{transform:rotate(0deg)}40%,70%{transform:rotate(-6deg)}}
@keyframes ywJaw{0%,100%{transform:rotate(0deg)}40%,70%{transform:rotate(14deg)}}
@keyframes ywWisp{0%{opacity:0;transform:translate(0,0) scale(.5)}30%{opacity:.8}100%{opacity:0;transform:translate(-6px,-30px) scale(1.15)}}
.tilt-g{transform-origin:100px 120px;animation:ywTilt 4.4s ease-in-out infinite}
.jaw{transform-origin:100px 146px;animation:ywJaw 4.4s ease-in-out infinite}
.wisp{animation:ywWisp 2.2s ease-out infinite}
.wisp2{animation:ywWisp 2.2s ease-out infinite .7s}
.wisp3{animation:ywWisp 2.2s ease-out infinite 1.4s}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs><filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<g class="tilt-g">
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8" opacity="0.7"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<path d="M78,92 Q88,88 96,92" stroke="#7FF3FF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
<path d="M104,92 Q112,88 122,92" stroke="#7FF3FF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
<path d="M72,116 L78,124 M79,114 L85,122" stroke="#1E90A8" stroke-width="1.4" opacity="0.6"/>
<path d="M128,116 L122,124 M121,114 L115,122" stroke="#1E90A8" stroke-width="1.4" opacity="0.6"/>
<polygon class="jaw" points="84,146 116,146 108,160 92,160" fill="#0B1119" stroke="#1E90A8" stroke-width="1.3"/>
<circle class="wisp" cx="96" cy="150" r="4" fill="#22D9EE" filter="url(#mk-blur)"/>
<circle class="wisp2" cx="104" cy="152" r="3" fill="#22D9EE" filter="url(#mk-blur)"/>
<circle class="wisp3" cx="100" cy="148" r="3.4" fill="#7FF3FF" filter="url(#mk-blur)"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
</g>
</svg>
