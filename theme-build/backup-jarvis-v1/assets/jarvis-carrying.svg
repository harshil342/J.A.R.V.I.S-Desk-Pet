<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes glowPulse{0%,100%{opacity:0.55}50%{opacity:0.9}}
@keyframes spinCW{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spinCCW{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
.glow{animation:glowPulse 1.6s ease-in-out infinite}
.ring-in{transform-origin:100px 92px;animation:spinCW 4s linear infinite}
.ring-out{transform-origin:100px 92px;animation:spinCCW 6s linear infinite}
.carrier{transform-origin:100px 92px;animation:spinCW 3s linear infinite}
</style>
<ellipse cx="100" cy="178" rx="40" ry="6" fill="#020B14" opacity="0.5"/>
<defs>
<filter id="jarvis-blur" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="7"/>
</filter>
</defs>
<circle cx="100" cy="92" r="48" fill="#081426" stroke="#0E2C4A" stroke-width="3"/>
<circle cx="100" cy="92" r="36" fill="#061020" stroke="#0A2036" stroke-width="2"/>
