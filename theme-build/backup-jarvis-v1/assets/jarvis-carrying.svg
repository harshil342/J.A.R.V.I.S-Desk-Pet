<g transform="rotate(144 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(180 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(216 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(252 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(288 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<g transform="rotate(324 100 92)"><rect x="96.5" y="58" width="7" height="13" rx="2.5" fill="#155E86"/></g>
<circle class="glow" cx="100" cy="92" r="26" fill="#1FC8E8" filter="url(#jarvis-blur)"/>
<circle cx="100" cy="92" r="19" fill="#C9F6FF" stroke="#6FE8FF" stroke-width="2.5"/>
<polygon points="100,81 109.5,97.5 90.5,97.5" fill="#7FE9FF" opacity="0.9"/>
<circle cx="100" cy="92" r="4.5" fill="#FFFFFF"/>
<circle class="ring-in" cx="100" cy="92" r="53" fill="none" stroke="#2FB6D9" stroke-width="2" stroke-dasharray="10 7" opacity="0.75"/>
<circle class="ring-out" cx="100" cy="92" r="60" fill="none" stroke="#1E8FB3" stroke-width="1.6" stroke-dasharray="2 10" opacity="0.6"/>
<g class="carrier">
<g transform="translate(100,28)"><rect x="-6" y="-5" width="12" height="10" rx="2" fill="#0E2C4A" stroke="#6FE8FF" stroke-width="1.5"/><circle cx="0" cy="0" r="1.8" fill="#7FE9FF"/></g>
<g transform="translate(155,124)"><rect x="-5" y="-4" width="10" height="8" rx="2" fill="#0E2C4A" stroke="#6FE8FF" stroke-width="1.5"/><circle cx="0" cy="0" r="1.5" fill="#7FE9FF"/></g>
<g transform="translate(45,124)"><rect x="-5" y="-4" width="10" height="8" rx="2" fill="#0E2C4A" stroke="#6FE8FF" stroke-width="1.5"/><circle cx="0" cy="0" r="1.5" fill="#7FE9FF"/></g>
</g>
<g class="core-g"><circle cx="100" cy="92" r="19" fill="#C9F6FF" stroke="#6FE8FF" stroke-width="2.5"/>
<polygon points="100,81 109.5,97.5 90.5,97.5" fill="#7FE9FF" opacity="0.9"/>
<circle cx="100" cy="92" r="4.5" fill="#FFFFFF"/></g>
</svg>
