<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
    .stutter { animation: jvStut 1.6s steps(1, end) infinite; }
    @keyframes jvStut { 0% {opacity:.9} 12% {opacity:.1} 20% {opacity:.7} 34% {opacity:.15} 46% {opacity:.55} 60% {opacity:.05} 74% {opacity:.4} 100% {opacity:.1} }
    .blink { animation: jvBlink .5s steps(2, jump-none) infinite; }
    @keyframes jvBlink { 0% {opacity:1} 100% {opacity:.2} }
  </style>

  <g>
  <!-- whole HUD sags downward -->
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 2; 0 1; 0 5; 0 4; 0 8" dur="1.8s" fill="freeze"/>

  <!-- rings powering down in staggered flickers -->
  <g class="stutter">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
  </g>
  <g opacity="0.6">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animate attributeName="opacity" values="0.6;0.5;0.2;0.4;0.1;0.3;0" dur="1.8s" fill="freeze"/>
  </g>
  <g opacity="0.5">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
    <animate attributeName="opacity" values="0.5;0.1;0.4;0" dur="1.6s" fill="freeze"/>
  </g>
  <g opacity="0.7">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animate attributeName="opacity" values="0.7;0.2;0.5;0.1" dur="1.8s" fill="freeze"/>
  </g>

  <!-- core shrinking and failing -->
  <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0.35" filter="url(#jvBlur)">
    <animate attributeName="opacity" values="0.35;0.1;0.25;0.05" dur="1.8s" fill="freeze"/>
  </rect>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)">
    <animate attributeName="opacity" values="1;0.4;0.8;0.2" dur="1.8s" fill="freeze"/>
  </circle>
  <circle cx="100" cy="100" r="11" fill="#35E8F7" filter="url(#jvGlow)">
    <animate attributeName="r" values="11;9;10;6;7;3" dur="1.8s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.4;0.8;0.3;0.6;0.15" dur="1.8s" fill="freeze"/>
  </circle>

  <text class="txt blink" x="100" y="40">PWR_LOSS</text>
  <text class="txt" x="100" y="167" opacity="0.6">CORE_V10.2</text>
  </g>
</svg>
