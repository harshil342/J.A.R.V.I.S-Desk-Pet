<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #1E8FA0; text-anchor: middle; }
    .nod { animation: jvNod 3s ease-in-out infinite; }
    @keyframes jvNod { 0%,100% {opacity:.5} 50% {opacity:.15} }
  </style>

  <!-- everything dimmed and slow: low power mode -->
  <g opacity="0.25">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="70s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.35">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="50s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.2">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
  </g>
  <g opacity="0.3">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="60s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.4">
    <circle cx="100" cy="100" r="52" fill="none" stroke="#2FE0F2" stroke-width="1.4" stroke-dasharray="0.6 5.4"/>
  </g>

  <!-- droopy core, heavy slow breathe -->
  <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0.2" filter="url(#jvBlur)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#17C3D6" stroke-width="3" opacity="0.5"/>
  <circle cx="100" cy="100" r="10" fill="#2FE0F2" opacity="0.6" filter="url(#jvGlow)">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="10;8.5;10" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- doze blip: a single slow orbiting dot, like a head nodding -->
  <g class="nod">
    <circle cx="100" cy="48" r="2.5" fill="#2FE0F2"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
  </g>

  <text class="txt" x="100" y="40" opacity="0.6">LOW_PWR</text>
  <text class="txt" x="100" y="167" opacity="0.5">IDLE_5MIN</text>
</svg>
