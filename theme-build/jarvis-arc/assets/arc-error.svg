<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #FF5468; text-anchor: middle; }
    .blink { animation: jvBlink .4s steps(2, jump-none) infinite; }
    @keyframes jvBlink { 0% {opacity:1} 100% {opacity:.25} }
    .glitch { animation: jvGl .35s steps(1, end) infinite; }
    @keyframes jvGl { 0% {transform:translate(0,0)} 20% {transform:translate(2px,-1px)} 40% {transform:translate(-2px,1px)} 60% {transform:translate(1px,2px)} 80% {transform:translate(-1px,-2px)} 100% {transform:translate(0,0)} }
  </style>

  <g class="glitch">
    <!-- red-alert rings -->
    <g opacity="0.6">
      <circle cx="100" cy="100" r="94" fill="none" stroke="#FF3B50" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.9" filter="url(#jvGlow)">
      <circle cx="100" cy="100" r="82" fill="none" stroke="#FF3B50" stroke-width="7" stroke-dasharray="1.6 3.4"/>
      <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="5s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.6">
      <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#FF3B50" stroke-width="1"/>
    </g>
    <g opacity="0.8" filter="url(#jvGlow)">
      <circle cx="100" cy="100" r="66" fill="none" stroke="#FF3B50" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- unstable core -->
    <rect x="80" y="80" width="40" height="40" fill="#FF3B50" opacity="0.4" filter="url(#jvBlur)"/>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#FF3B50" stroke-width="3.5" filter="url(#jvGlow)"/>
    <circle cx="100" cy="100" r="11" fill="#FF7787" filter="url(#jvGlow)">
      <animate attributeName="opacity" values="1;0.3;1;0.5;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>

    <!-- warning triangle overlay -->
    <path d="M100,74 L122,112 L78,112 Z" fill="none" stroke="#FFB0B9" stroke-width="2" filter="url(#jvGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <line x1="100" y1="86" x2="100" y2="100" stroke="#FFB0B9" stroke-width="2.5"/>
    <circle cx="100" cy="106" r="1.8" fill="#FFB0B9"/>
  </g>

  <text class="txt blink" x="100" y="40">FAULT</text>
  <text class="txt" x="100" y="167" opacity="0.8">ERR_0x2F</text>
</svg>
