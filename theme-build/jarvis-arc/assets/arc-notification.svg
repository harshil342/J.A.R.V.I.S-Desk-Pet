<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
    .blink { animation: jvBlink .8s steps(2, jump-none) infinite; }
    @keyframes jvBlink { 0% {opacity:.95} 100% {opacity:.35} }
  </style>

  <g opacity="0.55">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="26s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.85" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.5">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
  </g>
  <g opacity="0.8">
    <circle cx="100" cy="100" r="52" fill="none" stroke="#2FE0F2" stroke-width="1.6" stroke-dasharray="0.6 5.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="7s" repeatCount="indefinite"/>
  </g>

  <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0.45" filter="url(#jvBlur)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)"/>
  <circle cx="100" cy="100" r="11" fill="#35E8F7" filter="url(#jvGlow)">
    <animate attributeName="r" values="11;12;11" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- quirk: data packet drops into the dial and docks -->
  <g filter="url(#jvGlow)">
    <rect x="93" y="20" width="14" height="10" fill="none" stroke="#7FF3FC" stroke-width="1.6"/>
    <line x1="96" y1="25" x2="104" y2="25" stroke="#7FF3FC" stroke-width="1"/>
    <animateTransform attributeName="transform" type="translate" values="0 -18; 0 26; 0 22; 0 26" keyTimes="0;0.5;0.7;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.3;0.7;1" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <!-- dock flash when packet lands -->
  <circle cx="100" cy="50" r="10" fill="none" stroke="#7FF3FC" stroke-width="1.4" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.45;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;6;16;20" keyTimes="0;0.45;0.55;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text class="txt blink" x="100" y="40">MSG_IN</text>
  <text class="txt" x="100" y="167" opacity="0.8">BUFFER_1</text>
</svg>
