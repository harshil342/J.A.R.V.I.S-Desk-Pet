<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
  </style>

  <!-- gyro wobble while being dragged -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 100 100; 8 100 100; -8 100 100" dur="0.8s" repeatCount="indefinite"/>

    <g opacity="0.6">
      <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="7s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.9" filter="url(#jvGlow)">
      <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="4s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.55">
      <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
    </g>
    <g opacity="0.8" filter="url(#jvGlow)">
      <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
      <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- squished unstable core -->
    <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0.45" filter="url(#jvBlur)"/>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)"/>
    <circle cx="100" cy="100" r="11" fill="#35E8F7" filter="url(#jvGlow)">
      <animate attributeName="r" values="11;9;12;10;11" dur="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- gyro crosshair ticks -->
    <g stroke="#7FF3FC" stroke-width="1.6" opacity="0.8">
      <line x1="100" y1="56" x2="100" y2="64"/>
      <line x1="100" y1="136" x2="100" y2="144"/>
      <line x1="56" y1="100" x2="64" y2="100"/>
      <line x1="136" y1="100" x2="144" y2="100"/>
    </g>
  </g>

  <text class="txt" x="100" y="40" opacity="0.9">GYRO</text>
  <text class="txt" x="100" y="167" opacity="0.8">UNHANDLED</text>
</svg>
