<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #7FF3FC; text-anchor: middle; }
  </style>

  <g opacity="0.6">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.95" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.85" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- surge burst rings -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#7FF3FC" stroke-width="2.5" opacity="0">
    <animate attributeName="r" values="20;92" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#7FF3FC" stroke-width="1.6" opacity="0">
    <animate attributeName="r" values="20;92" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
  </circle>

  <!-- radial arc flickers -->
  <g stroke="#7FF3FC" stroke-width="2" stroke-linecap="round" filter="url(#jvGlow)">
    <line x1="100" y1="30" x2="100" y2="16" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="100" y1="170" x2="100" y2="184" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.2s" repeatCount="indefinite"/></line>
    <line x1="30" y1="100" x2="16" y2="100" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.1s" repeatCount="indefinite"/></line>
    <line x1="170" y1="100" x2="184" y2="100" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="52" y1="52" x2="42" y2="42" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.15s" repeatCount="indefinite"/></line>
    <line x1="148" y1="148" x2="158" y2="158" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.35s" repeatCount="indefinite"/></line>
  </g>

  <!-- overcharged core -->
  <rect x="78" y="78" width="44" height="44" fill="#17C3D6" opacity="0.7" filter="url(#jvBlur)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#7FF3FC" stroke-width="4" filter="url(#jvGlow)"/>
  <circle cx="100" cy="100" r="13" fill="#D9FBFD" filter="url(#jvGlow)">
    <animate attributeName="r" values="13;15;12;14;13" dur="0.7s" repeatCount="indefinite"/>
  </circle>

  <text class="txt" x="100" y="40" opacity="0.95">SURGE</text>
  <text class="txt" x="100" y="167" opacity="0.85">OUTPUT_MAX</text>
</svg>
