<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #17798A; text-anchor: middle; }
    .breathe { animation: jvBr 6s ease-in-out infinite; }
    @keyframes jvBr { 0%,100% {opacity:.12} 50% {opacity:.32} }
  </style>

  <!-- standby: only the faintest skeleton remains -->
  <g opacity="0.12">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="120s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.15">
    <circle cx="100" cy="100" r="52" fill="none" stroke="#2FE0F2" stroke-width="1.4" stroke-dasharray="0.6 5.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="80s" repeatCount="indefinite"/>
  </g>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#17C3D6" stroke-width="2.5" opacity="0.18"/>

  <!-- ember core: slow heartbeat -->
  <rect x="82" y="82" width="36" height="36" fill="#17C3D6" opacity="0.12" filter="url(#jvBlur)" class="breathe"/>
  <circle cx="100" cy="100" r="7" fill="#2FE0F2" filter="url(#jvGlow)">
    <animate attributeName="opacity" values="0.3;0.12;0.3" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;6;7" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- quirk: lone sentinel blip circling the dead ring once in a while -->
  <g opacity="0.5">
    <circle cx="100" cy="62" r="1.6" fill="#2FE0F2"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="7s" repeatCount="indefinite"/>
  </g>

  <text class="txt" x="100" y="40" opacity="0.5">STANDBY</text>
  <text class="txt" x="100" y="167" opacity="0.4">WAKE_ON_INPUT</text>
</svg>
