<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
    .blink { animation: jvBlink .6s steps(2, jump-none) infinite; }
    @keyframes jvBlink { 0% {opacity:.95} 100% {opacity:.3} }
  </style>

  <!-- boot sequence: rings light up one by one -->
  <g opacity="0">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animate attributeName="opacity" values="0;0.5" dur="0.4s" begin="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="30s" repeatCount="indefinite"/>
  </g>
  <g opacity="0" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animate attributeName="opacity" values="0;1;0.6;0.85" dur="0.5s" begin="0.75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="14s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
    <animate attributeName="opacity" values="0;0.5" dur="0.4s" begin="0.55s" fill="freeze"/>
  </g>
  <g opacity="0" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
    <animate attributeName="opacity" values="0;0.8" dur="0.4s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="20s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <circle cx="100" cy="100" r="52" fill="none" stroke="#2FE0F2" stroke-width="1.4" stroke-dasharray="0.6 5.4"/>
    <animate attributeName="opacity" values="0;0.7" dur="0.4s" begin="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
  </g>

  <!-- core ignition flare -->
  <rect x="80" y="80" width="40" height="40" fill="#17C3D6" opacity="0" filter="url(#jvBlur)">
    <animate attributeName="opacity" values="0;0.5" dur="0.5s" begin="0.1s" fill="freeze"/>
  </rect>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" opacity="0" filter="url(#jvGlow)">
    <animate attributeName="opacity" values="0;1;0.5;1" dur="0.6s" begin="0s" fill="freeze"/>
  </circle>
  <circle cx="100" cy="100" r="3" fill="#7FF3FC" filter="url(#jvGlow)">
    <animate attributeName="r" values="3;13;11" dur="0.9s" fill="freeze"/>
    <animate attributeName="opacity" values="0.4;1;0.95" dur="0.9s" fill="freeze"/>
  </circle>

  <!-- ignition spark ring -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="#7FF3FC" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="12;70" dur="0.9s" begin="0.15s"/>
    <animate attributeName="opacity" values="0.9;0" dur="0.9s" begin="0.15s"/>
  </circle>

  <text class="txt blink" x="100" y="40">BOOT_SEQ</text>
  <text class="txt" x="100" y="167" opacity="0.8">CORE_V10.2</text>
</svg>
