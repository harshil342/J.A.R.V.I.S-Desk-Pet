<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="jvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jvBlur" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    .txt { font: 6.5px Consolas, 'Courier New', monospace; letter-spacing: 2px; fill: #2AB8CA; text-anchor: middle; }
  </style>

  <g opacity="0.45">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#17C3D6" stroke-width="1.3" stroke-dasharray="12 7 3 9 20 11 5 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.7" filter="url(#jvGlow)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#2FE0F2" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.4">
    <polygon points="176,100 138,165.9 62,165.9 24,100 62,34.1 138,34.1" fill="none" stroke="#17C3D6" stroke-width="1"/>
  </g>
  <g opacity="0.6">
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2FE0F2" stroke-width="3.5" stroke-dasharray="30 12 10 16 22 14"/>
  </g>

  <!-- core flares wide: the yawn -->
  <rect x="78" y="78" width="44" height="44" fill="#17C3D6" opacity="0.55" filter="url(#jvBlur)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2FE0F2" stroke-width="3.5" filter="url(#jvGlow)"/>
  <circle cx="100" cy="100" r="11" fill="#7FF3FC" filter="url(#jvGlow)">
    <animate attributeName="r" values="11;16;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- vent arcs exhaling left/right -->
  <path d="M52,86 Q40,100 52,114" fill="none" stroke="#35E8F7" stroke-width="2.5" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="6 0; -8 0; 6 0" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M148,86 Q160,100 148,114" fill="none" stroke="#35E8F7" stroke-width="2.5" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-6 0; 8 0; -6 0" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- rising heat ticks -->
  <g opacity="0">
    <line x1="88" y1="58" x2="88" y2="50" stroke="#35E8F7" stroke-width="1.5"/>
    <line x1="100" y1="54" x2="100" y2="45" stroke="#35E8F7" stroke-width="1.5"/>
    <line x1="112" y1="58" x2="112" y2="50" stroke="#35E8F7" stroke-width="1.5"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 4; 0 -8" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </g>

  <text class="txt" x="100" y="40" opacity="0.85">VENT_HEAT</text>
  <text class="txt" x="100" y="167" opacity="0.7">CORE_V10.2</text>
</svg>
