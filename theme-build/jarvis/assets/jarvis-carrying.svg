<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes cBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes cSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes cField{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes cThrust{0%,100%{opacity:.5}50%{opacity:1}}
.hover-g{animation:cBob 4.6s ease-in-out infinite}
.load{transform-origin:100px 146px;animation:cSway 4.6s ease-in-out infinite}
.field{animation:cField 1.8s ease-in-out infinite}
.thrust{animation:cThrust 1s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="48" ry="6" fill="#04070C" opacity="0.6"/>
<defs><filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<g class="hover-g">
<polygon points="100,148 86,170 100,163 114,170" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#64E6EF" stroke-width="1.8"/>
<polygon points="56,104 36,130 60,132" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 164,130 140,132" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle cx="88" cy="92.5" r="3.2" fill="#B4F6FB"/>
<circle cx="112" cy="92.5" r="3.2" fill="#B4F6FB"/>
<circle cx="100" cy="134" r="8" fill="#64E6EF" filter="url(#mk-blur)" opacity="0.7"/>
<path d="M100,138 L105.5,131 L94.5,131 Z" fill="#D1FBFC" stroke="#B4F6FB" stroke-width="1.4"/>
<line class="field" x1="62" y1="132" x2="86" y2="150" stroke="#64E6EF" stroke-width="1.4" stroke-dasharray="3 4"/>
<line class="field" x1="138" y1="132" x2="114" y2="150" stroke="#64E6EF" stroke-width="1.4" stroke-dasharray="3 4"/>
<g class="load">
<rect x="86" y="148" width="28" height="22" fill="#0B1119" stroke="#64E6EF" stroke-width="1.6"/>
<path d="M86,148 L100,154 L114,148 M100,154 L100,170" stroke="#1E90A8" stroke-width="1.2" fill="none"/>
<circle cx="100" cy="159" r="2.4" fill="#FF3D81"/>
</g>
<circle class="thrust" cx="87" cy="168" r="4" fill="#64E6EF" filter="url(#mk-blur)"/>
<circle class="thrust" cx="113" cy="168" r="4" fill="#64E6EF" filter="url(#mk-blur)"/>
</g>
</svg>
