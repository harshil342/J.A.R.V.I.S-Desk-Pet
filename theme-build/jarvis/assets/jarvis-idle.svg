<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes mkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes mkTail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes mkPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes mkScan{0%{transform:translateX(-46px)}100%{transform:translateX(46px)}}
@keyframes mkBlink{0%,88%,100%{opacity:.9}92%{opacity:.2}}
@keyframes mkGlow{0%,100%{opacity:.65}50%{opacity:1}}
.fin-l{transform-origin:58px 106px;animation:mkTail 3.8s ease-in-out infinite}
.fin-r{transform-origin:142px 106px;animation:mkTail 3.8s ease-in-out infinite reverse}
.tail{transform-origin:100px 152px;animation:mkTail 3s ease-in-out infinite}
.hover-g{animation:mkBob 3.8s ease-in-out infinite}
.core-glow{animation:mkGlow 3s ease-in-out infinite}
.dorsal-led{animation:mkBlink 4.2s linear infinite}
.scanseg{animation:mkScan 3.4s linear infinite}
.sensor{transition:transform 0.2s ease-out}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs>
<filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="mk-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1"/></filter>
<clipPath id="mk-visorclip"><rect x="70" y="84" width="60" height="17" rx="6"/></clipPath>
</defs>
<!-- arc-reactor aura (J.A.R.V.I.S reference rings) -->
<circle cx="100" cy="96" r="96" fill="none" stroke="#B4F6FB" stroke-width="1.4" stroke-dasharray="50 5" opacity="0.35"/>
<circle cx="100" cy="96" r="91" fill="none" stroke="#64E6EF" stroke-width="1" opacity="0.3"/>
<circle cx="100" cy="96" r="78" fill="none" stroke="#B4F6FB" stroke-width="7" stroke-dasharray="2 2.29" opacity="0.4">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="360 100 96" dur="10s" repeatCount="indefinite"/>
</circle>
<circle cx="100" cy="96" r="58" fill="none" stroke="#B4F6FB" stroke-width="1.6" stroke-dasharray="50 25" opacity="0.4">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="-360 100 96" dur="10s" repeatCount="indefinite"/>
</circle>
<g class="hover-g">
<polygon class="tail" points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<path d="M100,30 L100,78 M74,96 L126,96" stroke="#1A2836" stroke-width="1"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline class="dorsal-led" points="100,10 112,38" fill="none" stroke="#64E6EF" stroke-width="1.8"/>
<polygon class="fin-l" points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon class="fin-r" points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polyline points="64,96 60,104 64,112" fill="none" stroke="#FF3D81" stroke-width="1.4" opacity="0.55"/>
<polyline points="136,96 140,104 136,112" fill="none" stroke="#FF3D81" stroke-width="1.4" opacity="0.55"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<g clip-path="url(#mk-visorclip)"><rect class="scanseg" x="86" y="89" width="18" height="7" fill="#64E6EF" opacity="0.35"/></g>
<circle id="sensor-left" class="sensor" cx="88" cy="92.5" r="3.2" fill="#B4F6FB"/>
<circle id="sensor-right" class="sensor" cx="112" cy="92.5" r="3.2" fill="#B4F6FB"/>
<path d="M72,116 L78,124 M79,114 L85,122 M86,112 L92,120" stroke="#1E90A8" stroke-width="1.4" opacity="0.6"/>
<path d="M128,116 L122,124 M121,114 L115,122 M114,112 L108,120" stroke="#1E90A8" stroke-width="1.4" opacity="0.6"/>
<!-- chest mini-reactor: glow ring + triangle core -->
<circle class="core-glow" cx="100" cy="134" r="11" fill="#64E6EF" filter="url(#mk-blur)"/>
<circle cx="100" cy="134" r="10" fill="none" stroke="#64E6EF" stroke-width="3" filter="url(#mk-soft)" opacity="0.9"/>
<circle cx="100" cy="134" r="7" fill="none" stroke="#64E6EF" stroke-width="1.2"/>
<path d="M100,138.5 L106.5,130.5 L93.5,130.5 Z" fill="#D1FBFC" stroke="#B4F6FB" stroke-width="1.6"/>
<rect x="82" y="156" width="10" height="6" rx="2" fill="#0B1119" stroke="#1C2A3B" stroke-width="1"/>
<rect x="108" y="156" width="10" height="6" rx="2" fill="#0B1119" stroke="#1C2A3B" stroke-width="1"/>
</g>
</svg>
