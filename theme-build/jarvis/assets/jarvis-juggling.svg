<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes jBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jOrbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes jTail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes jGlow{0%,100%{opacity:.6}50%{opacity:1}}
.hover-g{animation:jBob 2.8s ease-in-out infinite}
.orbit{transform-origin:100px 96px;animation:jOrbit 3.2s linear infinite}
.tail{transform-origin:100px 152px;animation:jTail 1.6s ease-in-out infinite}
.core-glow{animation:jGlow 2s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs><filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<g class="hover-g">
<polygon class="tail" points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#22D9EE" stroke-width="1.8"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle cx="88" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle cx="112" cy="92.5" r="3.2" fill="#7FF3FF"/>
<circle class="core-glow" cx="100" cy="134" r="9" fill="#22D9EE" filter="url(#mk-blur)"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#08131C" stroke="#22D9EE" stroke-width="1.5"/>
</g>
<g class="orbit">
<circle cx="100" cy="34" r="7" fill="#22D9EE" filter="url(#mk-blur)"/>
<circle cx="47" cy="128" r="7" fill="#FF3D81" filter="url(#mk-blur)"/>
<circle cx="153" cy="128" r="7" fill="#FFB020" filter="url(#mk-blur)"/>
</g>
</svg>
