<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes dFlail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes dFinL{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(10deg)}}
@keyframes dFinR{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-10deg)}}
@keyframes dStreak{0%,100%{opacity:.15}50%{opacity:.7}}
@keyframes dTail{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.flail-g{transform-origin:100px 100px;animation:dFlail .7s ease-in-out infinite}
.fin-l{transform-origin:58px 106px;animation:dFinL .7s ease-in-out infinite}
.fin-r{transform-origin:142px 106px;animation:dFinR .7s ease-in-out infinite}
.tail{transform-origin:100px 152px;animation:dTail .7s ease-in-out infinite}
.streak{animation:dStreak .7s ease-in-out infinite}
</style>
<ellipse cx="100" cy="178" rx="40" ry="5" fill="#04070C" opacity="0.45"/>
<path class="streak" d="M40,60 L58,66 M38,76 L56,80" stroke="#B4F6FB" stroke-width="1.6" stroke-linecap="round" fill="none"/>
<path class="streak" d="M160,60 L142,66 M162,76 L144,80" stroke="#B4F6FB" stroke-width="1.6" stroke-linecap="round" fill="none"/>
<g class="flail-g">
<polygon class="tail" points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#64E6EF" stroke-width="1.8"/>
<polygon class="fin-l" points="56,104 26,116 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon class="fin-r" points="144,104 174,116 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle cx="88" cy="92.5" r="4.2" fill="#D1FBFC"/>
<circle cx="112" cy="92.5" r="4.2" fill="#D1FBFC"/>
