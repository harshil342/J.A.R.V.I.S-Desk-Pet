<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes sArc1{0%,100%{opacity:0}10%,26%{opacity:1}30%{opacity:0}64%,76%{opacity:.9}80%{opacity:0}}
@keyframes sArc2{0%,100%{opacity:0}34%,48%{opacity:1}52%{opacity:0}84%,94%{opacity:.8}98%{opacity:0}}
@keyframes sBurst{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes sFlash{0%,100%{opacity:.6}12%,20%{opacity:1}50%{opacity:.6}66%,74%{opacity:1}}
.arc1{animation:sArc1 2.4s linear infinite}
.arc2{animation:sArc2 2.4s linear infinite}
.burst{transform-origin:100px 96px;animation:sBurst 1.2s ease-out infinite}
.core-glow{animation:sFlash 2.4s linear infinite}
</style>
<ellipse cx="100" cy="178" rx="44" ry="6" fill="#04070C" opacity="0.55"/>
<defs><filter id="mk-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<!-- arc-reactor aura burst -->
<circle cx="100" cy="96" r="88" fill="none" stroke="#B4F6FB" stroke-width="5" stroke-dasharray="2 2.29" opacity="0.35">
<animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 96" to="360 100 96" dur="3s" repeatCount="indefinite"/>
</circle>
<circle class="burst" cx="100" cy="96" r="52" fill="none" stroke="#B4F6FB" stroke-width="2"/>
<g>
<polygon points="100,148 84,174 100,164 116,174" fill="#0B1119" stroke="#1C2A3B" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0F1620" stroke="#22344A" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#121B27" stroke="#22344A" stroke-width="1.4"/>
<polyline points="100,10 112,38" fill="none" stroke="#64E6EF" stroke-width="1.8"/>
<polygon points="56,104 30,124 58,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<polygon points="144,104 170,124 142,128" fill="#101923" stroke="#22344A" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#060A10" stroke="#1B2C3F" stroke-width="1.4"/>
<rect x="72" y="90" width="56" height="5" rx="2.5" fill="#0E4A5C"/>
<circle cx="88" cy="92.5" r="3.6" fill="#FFFFFF"/>
<circle cx="112" cy="92.5" r="3.6" fill="#FFFFFF"/>
<circle class="core-glow" cx="100" cy="134" r="10" fill="#B4F6FB" filter="url(#mk-blur)"/>
<circle cx="100" cy="134" r="9" fill="none" stroke="#64E6EF" stroke-width="2.6" opacity="0.9"/>
<path d="M100,138.5 L106.5,130.5 L93.5,130.5 Z" fill="#D1FBFC" stroke="#B4F6FB" stroke-width="1.6"/>
</g>
<polyline class="arc1" points="46,60 56,66 48,74 60,80" fill="none" stroke="#B4F6FB" stroke-width="2" stroke-linejoin="round"/>
<polyline class="arc2" points="154,60 144,66 152,74 140,80" fill="none" stroke="#B4F6FB" stroke-width="2" stroke-linejoin="round"/>
<polyline class="arc1" points="100,6 94,16 104,20 96,30" fill="none" stroke="#64E6EF" stroke-width="2" stroke-linejoin="round"/>
<polyline class="arc2" points="36,120 48,116 44,126 56,122" fill="none" stroke="#64E6EF" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
