<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes slBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes slRing{0%,100%{opacity:.12}50%{opacity:.35}}
@keyframes slBit{0%{opacity:0;transform:translate(0,0)}25%{opacity:.7}100%{opacity:0;transform:translate(10px,-26px)}}
.rest-g{transform-origin:100px 160px;animation:slBreathe 4.6s ease-in-out infinite}
.standby{animation:slRing 4.6s ease-in-out infinite}
.bit{animation:slBit 3.6s linear infinite}
.bit2{animation:slBit 3.6s linear infinite 1.2s}
.bit3{animation:slBit 3.6s linear infinite 2.4s}
</style>
<ellipse cx="100" cy="178" rx="50" ry="6" fill="#04070C" opacity="0.6"/>
<g class="rest-g" transform="translate(0,20)">
<polygon points="100,148 88,168 100,162 112,168" fill="#0B1119" stroke="#16222F" stroke-width="1.4"/>
<path d="M100,30 L138,78 L144,118 Q144,152 100,164 Q56,152 56,118 L62,78 Z" fill="#0C1219" stroke="#182534" stroke-width="1.6"/>
<polygon points="100,10 88,38 112,38" fill="#0F1721" stroke="#182534" stroke-width="1.4"/>
<polygon points="56,104 36,128 58,128" fill="#0D151E" stroke="#182534" stroke-width="1.4"/>
<polygon points="144,104 164,128 142,128" fill="#0D151E" stroke="#182534" stroke-width="1.4"/>
<rect x="68" y="82" width="64" height="21" rx="6" fill="#04070C" stroke="#131E2A" stroke-width="1.4"/>
<rect x="72" y="91.5" width="56" height="2" rx="1" fill="#0B2E3C"/>
<polygon points="100,126 107,130 107,138 100,142 93,138 93,130" fill="#071018" stroke="#155A6E" stroke-width="1.5"/>
<circle class="standby" cx="100" cy="134" r="13" fill="none" stroke="#22D9EE" stroke-width="1.4" stroke-dasharray="4 6"/>
</g>
<g transform="translate(0,20)">
<rect class="bit" x="126" y="70" width="4" height="4" fill="#1E90A8"/>
<rect class="bit2" x="134" y="62" width="5" height="5" fill="#155A6E"/>
<rect class="bit3" x="129" y="52" width="6" height="6" fill="#0E4A5C"/>
</g>
</svg>
